<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <script type="module" src="../layout/header.js"></script>
  </head>
  <body>
    <div id="app">
      <app-header title="타이틀"></app-header>
      <div id="container"></div>
    </div>

    <!-- type="module" 필수 -->
    <script type="module">
      import { MenuList } from "../components/MenuList.js";
      import { CheckboxList } from "../components/CheckboxList.js";
      import { RadioList } from "../components/RadioList.js";

      const container = document.querySelector("#container");

      container.append(
        MenuList({
          items: [
            { id: 1, label: "Home", icon: "🏠", href: "#home" },
            { id: 2, label: "Profile", icon: "👤", href: "#profile" },
            {
              id: 3,
              label: "Settings",
              icon: "⚙️",
              href: "#settings",
              disabled: true,
            },
          ],
          renderItem: (item) => `
           <span class="icon">${item.icon}</span> 
           <span class="label">${item.label}</span> 
          `,
          toggle: true, // 여기서 toggle 모드 활성화
          onChange: (activeItems) => {
            console.log(
              "Active items:",
              activeItems.map((i) => i.label)
            );
          },
        }),

        CheckboxList({
          items: [
            { label: "Check 1" },
            { label: "Check 2", disabled: true },
            { label: "Check 3" },
          ],
          onChange: (activeItems) =>
            console.log(
              "Checkbox:",
              activeItems.map((i) => i.label)
            ),
        }),

        RadioList({
          items: [
            { label: "Option 1" },
            { label: "Option 2", disabled: true },
            { label: "Option 3" },
          ],
          onChange: (item) => console.log("Radio:", item.label),
        })
      );
    </script>
  </body>
</html>
