<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <script type="module" src="../js/index.js"></script>
  </head>
  <body>
    <div id="wrap">
      <!-- layout-header -->
      <layout-header title="타이틀"></layout-header>
      <!--// layout-header -->
      <div id="container">
        <!-- ===================== -->
        <!-- UI MENU EXAMPLE -->
        <!-- ===================== -->
        <ui-menu
          toggle
          onChange="(items) => console.log('Menu Active:', items)"
        >
          <ui-menu-item>Home</ui-menu-item>
          <ui-menu-item>Profile</ui-menu-item>
          <ui-menu-item disabled>Settings</ui-menu-item>
        </ui-menu>

        <!-- ===================== -->
        <!-- UI CHECKBOX EXAMPLE -->
        <!-- ===================== -->
        <ui-checkbox
          onChange="(items) => console.log('Checkbox Active:', items.map(i => i.textContent))"
        >
          <ui-checkbox-item class="active">Check 1</ui-checkbox-item>
          <ui-checkbox-item>Check 2</ui-checkbox-item>
          <ui-checkbox-item disabled>Check 3</ui-checkbox-item>
        </ui-checkbox>

        <!-- ===================== -->
        <!-- UI RADIO EXAMPLE -->
        <!-- ===================== -->
        <ui-radio
          onChange="(item) => console.log('Radio Active:', item.textContent)"
        >
          <ui-radio-item class="active">Option 1</ui-radio-item>
          <ui-radio-item>Option 2</ui-radio-item>
          <ui-radio-item disabled>Option 3</ui-radio-item>
        </ui-radio>

        <!-- ===================== -->
        <!-- UI TABS EXAMPLE -->
        <!-- ===================== -->
        <ui-tabs onChange="(panel) => console.log('Tab Active Panel:', panel)">
          <div class="tab_menu">
            <button>Tab 1</button>
            <button>Tab 2</button>
            <button>Tab 3</button>
          </div>
          <div class="tab_contents">
            <ui-tab-panel>Tab 1 Content</ui-tab-panel>
            <ui-tab-panel>Tab 2 Content</ui-tab-panel>
            <ui-tab-panel>Tab 3 Content</ui-tab-panel>
          </div>
        </ui-tabs>
      </div>
    </div>
